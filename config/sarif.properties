# Configuración de SARIF (fuera del código fuente, sección 10.5)
# Si existe config/sarif.local.properties, sus valores reemplazan a los de este archivo.
#
# Saqué estos datos del código para poder cambiar la conexión o los archivos
# de prueba sin recompilar. Este archivo está versionado y trae los valores
# del entorno de desarrollo; si en tu máquina usás otra clave u otro servidor,
# no lo modifiques: creá config/sarif.local.properties solo con las claves
# que querés cambiar.

# Conexión JDBC: base local, sin TLS; allowPublicKeyRetrieval habilita caching_sha2_password de MySQL 8
# Me conecto con sarif_app, el usuario que crea sql/01_esquema.sql y que solo
# tiene permisos de SELECT, INSERT, UPDATE y DELETE (nunca con root).
db.url=jdbc:mysql://localhost:3306/sarif?useSSL=false&allowPublicKeyRetrieval=true
db.usuario=sarif_app
db.clave=Sarif#2026

# Archivos del modo sin conexión (RNF06)
# Cuando no hay acceso a NASA FIRMS ni a Open-Meteo, la fuente de archivo lee
# estos CSV, que tienen el mismo formato que devuelven los servicios. Las rutas
# son relativas a la carpeta del proyecto: los focos de la jornada del
# 20/01/2026, el histórico de focos de 2020 a 2025 y la meteorología de la jornada.
archivo.focos=datos/focos_jornada_20260120.csv
archivo.focos.historico=datos/focos_historicos_2020_2025.csv
archivo.meteo=datos/meteo_20260120.csv

# Clave de NASA FIRMS (MAP_KEY)
# La clave es personal, así que acá la dejo vacía a propósito: este archivo se
# sube al repositorio. Poné la tuya en config/sarif.local.properties (que está
# en .gitignore) con la línea firms.clave=TU_CLAVE. Si no está en ningún
# archivo, SARIF la busca en el parámetro firms_clave de la base.
firms.clave=

# Credenciales OAuth de Copernicus Data Space (NDVI de Sentinel-2, RC05)
# Igual que la clave de FIRMS, son personales: van en config/sarif.local.properties.
# Se crean en https://shapps.dataspace.copernicus.eu/dashboard/ (User settings >
# OAuth clients > Create). El secreto solo se muestra una vez al crearlo.
copernicus.cliente=
copernicus.secreto=

# Mapa topográfico de la pestaña "Mapa de riesgo"
# Los mosaicos salen de OpenTopoMap y los que se descargan se guardan en la
# carpeta de caché, así la próxima vez se ven sin internet. Las imágenes NDVI
# de Sentinel-2 que se dibujan sobre el mapa también se guardan (una por zona
# y fecha). Las dos carpetas están en .gitignore y se pueden borrar sin problema.
mapa.url=https://tile.opentopomap.org/{z}/{x}/{y}.png
mapa.cache=cache/mosaicos
ndvi.cache=cache/ndvi
